<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ASLM Compositions V2</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#0050a4;
    margin:0;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

h1{
    text-align:center;
    color:#0050a4;
}

.section{
    margin-bottom:20px;
}

label{
    font-weight:bold;
}

select,
input[type=date]{
    width:100%;
    padding:10px;
    margin-top:5px;
}

.categorie{
    border:1px solid #ddd;
    border-radius:8px;
    padding:10px;
    margin-bottom:15px;
}

.categorie h3{
    margin-top:0;
    color:#0050a4;
}

.joueur{
    margin-bottom:5px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    background:#0050a4;
    color:white;
    font-size:16px;
    cursor:pointer;
    border-radius:6px;
}

button:hover{
    background:#003d80;
}

.message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

</style>

</head>
<div id="popupAjout" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
">

<div style="
background:white;
width:400px;
margin:100px auto;
padding:20px;
border-radius:10px;
">

<h3>Ajouter un joueur</h3>

<input
type="text"
id="nomJoueur"
placeholder="Nom"
style="width:100%;margin-bottom:10px;">

<input
type="text"
id="prenomJoueur"
placeholder="Prénom"
style="width:100%;margin-bottom:10px;">

<select
id="categorieJoueur"
style="width:100%;margin-bottom:10px;">
</select>

<button id="btnValiderAjout">
Ajouter
</button>

<button id="btnFermerAjout">
Fermer
</button>

</div>

</div>
<body>

<div class="container">

<h1>Composition ASLM</h1>

<div class="section">

<label>Equipe</label>

<select id="equipe">
    <option value="">Choisir une équipe</option>
    <option>U15 A</option>
    <option>U15 B</option>
    <option>U18</option>
    <option>Seniors A</option>
    <option>Seniors B</option>
    <option>Vétérans</option>
</select>

</div>

<div class="section">

<label>Date du match</label>

<input type="date" id="dateMatch">

</div>

<div id="joueursContainer">
Chargement des joueurs...
</div>

<button id="btnEnvoyer">
Envoyer la composition
</button>

<div id="message" class="message"></div>

</div>

<script>

const scriptURL =
'https://script.google.com/macros/s/AKfycbx-q_JJqETCq2mRcAP47ZyK3ZlPwUSuSfiJNjgk6kT9lOXNOWourxXVFFQYF_n-34q2/exec';

let joueursParCategorie = {};

console.log(joueursParCategorie);
alert(
    Object.keys(joueursParCategorie).length +
    " catégories chargées"
);

async function chargerJoueurs() {

    try {

        const response = await fetch(scriptURL);

        const data = await response.json();

        console.log("Réponse Apps Script", data);

        if(!data.success){
            throw new Error("Impossible de charger les joueurs");
        }

        joueursParCategorie =
            data.joueursParCategorie || {};

        afficherJoueurs();

    } catch(err){

        document.getElementById(
            "joueursContainer"
        ).innerHTML =
            "<p>Erreur chargement joueurs</p>";

        console.error(err);
    }
}

function afficherJoueurs(){

    const container =
        document.getElementById(
            "joueursContainer"
        );

    container.innerHTML = "";

    Object.entries(
        joueursParCategorie
    ).forEach(([categorie,joueurs])=>{

        const bloc =
            document.createElement("div");

        bloc.className = "categorie";

        const titre =
            document.createElement("h3");

        titre.textContent =
            categorie;

        bloc.appendChild(titre);

        joueurs.forEach(joueur=>{

            const ligne =
                document.createElement("div");

            ligne.className =
                "joueur";

            ligne.innerHTML = `
                <label>
                    <input
                        type="checkbox"
                        class="checkbox-joueur"
                        value="${joueur}">
                    ${joueur}
                </label>
            `;

            bloc.appendChild(ligne);

        });

        container.appendChild(bloc);

    });

}

document
.getElementById("btnEnvoyer")
.addEventListener("click",
async ()=>{

    const equipe =
        document
        .getElementById("equipe")
        .value;

    const dateMatch =
        document
        .getElementById("dateMatch")
        .value;

    if(!equipe){
        alert("Choisissez une équipe");
        return;
    }

    if(!dateMatch){
        alert("Choisissez une date");
        return;
    }

    const joueurs =
        [...document.querySelectorAll(
            ".checkbox-joueur:checked"
        )]
        .map(cb=>cb.value);

    console.log(
        "JOUEURS SELECTIONNES :", 
        joueurs
    );

    if(joueurs.length===0){
        alert("Sélectionnez au moins un joueur");
        return;
    }

   const donnees = {
    equipe: equipe,
    dateMatch: dateMatch,
    joueurs: joueurs
};

alert(
    JSON.stringify(
        donnees,
        null,
        2
    )
);

    try{

console.log(
    JSON.stringify(
        donnees,
        null,
        2
    )
);
        const response =
            await fetch(scriptURL,{
                method:"POST",
                headers:{
                    "Content-Type":
                    "text/plain;charset=utf-8"
                },
                body:JSON.stringify(
                    donnees
                )
            });

        const resultat =
            await response.json();

        if(resultat.success){

            document
            .getElementById("message")
            .style.color = "green";

            document
            .getElementById("message")
            .textContent =
                "✅ Composition enregistrée et mail envoyé";

        }
        else{

            throw new Error(
                resultat.message
            );

        }

    }catch(err){

        document
        .getElementById("message")
        .style.color = "red";

        document
        .getElementById("message")
        .textContent =
            "❌ " + err.message;

        console.error(err);
    }

});

window.addEventListener(
    "load",
    chargerJoueurs
);
document
.getElementById("btnAjouterJoueur")
.addEventListener("click", () => {

    const liste =
        document.getElementById(
            "categorieJoueur"
        );

    liste.innerHTML = "";

    Object.keys(
        joueursParCategorie
    ).forEach(cat => {

        const option =
            document.createElement(
                "option"
            );

        option.value = cat;
        option.textContent = cat;

        liste.appendChild(option);

    });

    document
    .getElementById("popupAjout")
    .style.display = "block";

});

document
.getElementById("btnFermerAjout")
.addEventListener("click", () => {

    document
    .getElementById("popupAjout")
    .style.display = "none";

});

document
.getElementById("btnValiderAjout")
.addEventListener("click",
async () => {

    const nom =
        document
        .getElementById(
            "nomJoueur"
        )
        .value;

    const prenom =
        document
        .getElementById(
            "prenomJoueur"
        )
        .value;

    const categorie =
        document
        .getElementById(
            "categorieJoueur"
        )
        .value;

    if (
        !nom ||
        !prenom ||
        !categorie
    ) {
        alert(
            "Tous les champs sont obligatoires"
        );
        return;
    }

    const response =
        await fetch(
            scriptURL,
            {
                method: "POST",
                headers: {
                    "Content-Type":
                    "text/plain;charset=utf-8"
                },
                body:
                JSON.stringify({
                    action:
                    "ajouterJoueur",
                    nom,
                    prenom,
                    categorie
                })
            }
        );

    const resultat =
        await response.json();

    if (
        resultat.success
    ) {

        alert(
            "Joueur ajouté"
        );

        document
        .getElementById(
            "popupAjout"
        )
        .style.display =
        "none";

        chargerJoueurs();

    }
    else {

        alert(
            resultat.message
        );

    }

});

</script>

</body>
</html>
